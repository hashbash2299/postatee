var L=function(m){document.getElementById('log').textContent+='\n'+m;};
document.getElementById('btn').addEventListener('click', async function(){
 try{
  L('يبدأ...');var C=new Caver('https://public-en.node.kaia.io');

 }catch(e){L('❌ '+(e.message||e));}
