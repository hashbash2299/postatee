name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Capacitor Config
        run: |
          echo '{"appId":"com.example.app","appName":"MyApp","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          if [ ! -d "www" ]; then mkdir www; echo "<h1>My App</h1>" > www/index.html; fi
          ls -la
          cat capacitor.config.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        run: |
          npx cap add android || true
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
