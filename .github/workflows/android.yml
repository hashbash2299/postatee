name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Next.js App
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.myapp.next","appName":"MyApp","webDir":"out","bundledWebRuntime":false}' > capacitor.config.json
          npm run build || npx next build
          ls -la
          if [ ! -d "out" ]; then
            echo "out folder not found, trying to create export"
            mkdir -p out
            echo "<html><body><h1>Build failed - check logs</h1></body></html>" > out/index.html
          fi
          ls -la out

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
